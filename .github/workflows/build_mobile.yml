name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Platform
        run: |
          mkdir -p ../temp_scaffold
          cd ../temp_scaffold
          flutter create --project-name sowesign_mobile_app --platforms=android --org com.sowesign.student app
          cp -r app/android "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf ../temp_scaffold
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests (Optional)
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Application (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native iOS Platform
        run: |
          mkdir -p ../temp_scaffold
          cd ../temp_scaffold
          flutter create --project-name sowesign_mobile_app --platforms=ios --org com.sowesign.student app
          cp -r app/ios "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf ../temp_scaffold

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Archive (Unsigned / Ad-Hoc IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SoWeSign-iOS.ipa Payload
          cd "$GITHUB_WORKSPACE"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-iOS-Release-IPA
          path: build/ios/iphoneos/SoWeSign-iOS.ipa
          if-no-files-found: warn
