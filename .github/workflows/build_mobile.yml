name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Platform
        run: |
          mkdir -p ../temp_scaffold
          cd ../temp_scaffold
          flutter create --project-name sowesign_mobile_app --platforms=android --org com.sowesign.student app
          cp -r app/android "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf ../temp_scaffold
          chmod +x android/gradlew
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
              with open(p, 'w') as f: f.write(c)
              print('INTERNET permission injected')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests (Optional)
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Application (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native iOS Platform
        run: |
          mkdir -p ../temp_scaffold
          cd ../temp_scaffold
          flutter create --project-name sowesign_mobile_app --platforms=ios --org com.sowesign.student app
          cp -r app/ios "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf ../temp_scaffold

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Archive (Unsigned / Ad-Hoc IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SoWeSign-iOS.ipa Payload
          cd "$GITHUB_WORKSPACE"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-iOS-Release-IPA
          path: build/ios/iphoneos/SoWeSign-iOS.ipa
          if-no-files-found: warn

  release:
    name: Publish Direct GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoWeSign-Android-Release-APK
          path: ./release_assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoWeSign-iOS-Release-IPA
          path: ./release_assets

      - name: Prepare Clean Release Files
        run: |
          cd ./release_assets
          if [ -f "app-release.apk" ]; then
            cp app-release.apk SoWeSign-Android.apk
          fi
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SoWeSign Mobile Apps (Dernière version)"
          body: |
            ## Téléchargement direct des applications SoWeSign

            - 🍎 **iPhone (iOS)** : [SoWeSign-iOS.ipa](https://github.com/${{ github.repository }}/releases/download/latest/SoWeSign-iOS.ipa)
            - 🤖 **Android** : [SoWeSign-Android.apk](https://github.com/${{ github.repository }}/releases/download/latest/SoWeSign-Android.apk)

            ---
            ### 📱 Guide d'installation sur iPhone via Scarlet (Zéro PC, Zéro Câble) :
            1. Ouvrez **Safari** sur votre iPhone et rendez-vous sur **[usescarlet.com](https://usescarlet.com)**.
            2. Descendez et appuyez sur **Install** puis **Direct Install**.
            3. Attendez quelques secondes puis appuyez sur **Ouvrir** / **Installer**.
            4. Rendez-vous dans les réglages de votre iPhone : **Réglages > Général > VPN et gestion des appareils** et validez le certificat en appuyant sur **Faire confiance**.
            5. Téléchargez le fichier **[SoWeSign-iOS.ipa](https://github.com/${{ github.repository }}/releases/download/latest/SoWeSign-iOS.ipa)** depuis Safari.
            6. Ouvrez l'application **Scarlet**, appuyez sur l'icône d'importation (en haut à droite) et choisissez le fichier `SoWeSign-iOS.ipa`.
            7. Appuyez sur **Installer** : l'application SoWeSign s'installe directement sur l'écran d'accueil de votre iPhone en natif !
          files: |
            release_assets/SoWeSign-iOS.ipa
            release_assets/SoWeSign-Android.apk
            release_assets/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
