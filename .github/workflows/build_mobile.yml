name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Platform
        run: flutter create . --platforms=android --org com.sowesign.student

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Application (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native iOS Platform
        run: flutter create . --platforms=ios --org com.sowesign.student

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Archive (Unsigned / Ad-Hoc IPA)
        run: |
          flutter build ios --release --no-codesign
          cd ios
          mkdir -p Payload
          cp -r ../build/ios/iphoneos/Runner.app Payload/
          zip -r ../build/ios/iphoneos/SoWeSign-iOS.ipa Payload
          cd ..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoWeSign-iOS-Release-IPA
          path: build/ios/iphoneos/SoWeSign-iOS.ipa
          if-no-files-found: warn
